[project]
name = "satark"
version = "0.1.0"
description = "Satark: check a suspicious investment message before money moves; learn by safe simulation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "phonenumbers>=8.13",
    "tldextract>=5.1",
    "idna>=3.7",
    "pydantic-ai-slim[anthropic,google,openai]>=1.0",
    "mcp>=2.3",
    "ddgs>=9.16.0",
    "fastembed>=0.8.1",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ingest = ["xlrd>=2.0", "openpyxl>=3.1"]
ocr = ["rapidocr-onnxruntime>=1.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "respx>=0.21",
    "ruff>=0.6",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.entry-points."satark.checkers"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: needs internet (skipped unless SATARK_NETWORK_TESTS=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"satark/infra/validators.py" = ["E701", "E702", "E741", "I001"]
