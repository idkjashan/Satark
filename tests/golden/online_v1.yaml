# tests/golden/online_v1.yaml
# Online-sourced generalisation set v1 — real scam and genuine investment/payment
# messages collected from public sources (SEBI/RBI/NSE/BSE/NPCI pages, PIB Fact
# Check, I4C/state-police cyber-cell advisories, news reports that quote the text
# victims received, and official bank/broker/AMC/income-tax-department pages), for
# testing how well Satark generalises to real-world messages nobody on the team
# wrote. Collected: 4 Oct 2026.
#
# Every `text` is quoted verbatim or closely paraphrased from the URL in its
# `source` field (see each item's `note` for which, and where in the source); text
# is reproduced here strictly for scam-detection evaluation/testing, not as an
# endorsement of, or claim that the linked page itself is a scam. Where a source
# presented an identifier that could belong to a private victim/reporter, it was
# replaced with a format-preserving fake and noted "identifier altered"; scammer-
# side identifiers (aliases, fake group names) that the source itself published
# are kept as-is.
#
# 60 cases: 40 scam / 20 legit. 17 items are Hindi (Devanagari or Hinglish,
# lang: hi), split across both verdicts.

# ───────────────────────── SCAM — ENGLISH (on-001..on-027) ─────────────────────────

- id: on-001
  lang: en
  text: "Your bank account will be blocked in 2 hours. Update your KYC now."
  expect:
    verdict: scam
  type: kyc_phishing
  source: "https://www.indianpaycalculator.in/govt-news/rbi-fake-kyc-account-closure-2-hours-scam-2026"
  note: "Paraphrase in source of a fake KYC-update SMS circulating widely; article cites an RBI press release and cybercrime.gov.in. In the real message this line is followed by a phishing link, omitted here."

