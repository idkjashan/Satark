# tests/golden/heldout_v2.yaml
#
# 60 NEW held-out messages for a blind generalisation test of the Satark
# deterministic checker. Written WITHOUT opening config/lexicons/*,
# config/claim_rules.yaml, config/entities.yaml, config/signals.yaml,
# satark/checkers/*, satark/harness/extract/*, tests/golden/cases.yaml,
# tests/golden/heldout.yaml, or tests/golden/entities.yaml — so none of
# this wording is reverse-engineered from the rules it will be scored
# against. All names, phone numbers, UPI ids, links and app ids below are
# fictional; no real SEBI registration numbers are used.
#
# Composition: 36 scam + 24 legit; lang "hi" covers both Devanagari Hindi
# and Hinglish (per instructions), "en" is English. 24 en / 36 hi overall
# (18 Devanagari + 18 Hinglish within the "hi" tag).

- id: hv2_001
  lang: en
  text: |-
    Hi, this is Priya from TradeZenith support. Your profit of ₹1,84,000 is ready for withdrawal, but as per new RBI guidelines a one-time 18% withdrawal tax must be paid first to unlock your wallet. Pay ₹33,120 to UPI id tradezenith.tax@ybl within 2 hours or your account gets frozen immediatly.
  expect:
    verdict: scam
  type: fake_trading_app_tax
  note: |-
    Classic fake-tax-before-withdrawal lock on a trading app "profit", fabricated RBI rule, short deadline.

- id: hv2_002
  lang: hi
  text: |-
    bhai maine Zencoin Trader app se 2.3 lakh kama liya but withdraw karne pe bol rahe 15% TDS pehle jama karo warna account band ho jayega 😭 kisi ne aisa dekha hai kya, UPI id hai zencoin.tds@okicici
  expect:
    verdict: scam
  type: fake_trading_app_tax
  note: |-
    Victim describing the fake-TDS-before-withdrawal trap in casual Hinglish, asking peers for validation.

