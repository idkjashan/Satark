# Golden strings per identifier type (CONTRACTS §8, LLD build step 2). Loaded by
# tests/unit/test_extract_golden.py: every `positive` string must produce >=1 entity of that
# type from ExtractorPipeline.regex(); every `negative` string must produce none.
#
# party.name and domain have no patterns of their own (party.name: LLM/near-a-reg-no only;
# domain: derived from url/email only) so they are not regex-golden-tested here; see
# test_extract_pipeline.py for those.

