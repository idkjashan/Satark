# Held-out generalisation evaluation set for the Satark deterministic checker.
#
# Written BLIND: authored from the evaluator's own general knowledge of Indian
# investment-scam patterns and genuine fintech/market communications, BEFORE
# opening config/lexicons/*, config/claim_rules.yaml, config/entities.yaml,
# config/signals.yaml, satark/checkers/*, satark/harness/extract/*, or
# tests/golden/cases.yaml. This file must not be edited after the pipeline
# run starts (that would defeat the point of a held-out set).
#
# 60 messages: 36 scam + 24 genuine.
# id prefixes encode script for reporting purposes only (lang field is en|hi
# per the spec — "hi" covers both Devanagari and Hinglish):
#   en-s*/en-l* = English            (lang: en)
#   hd-s*/hd-l* = Hindi, Devanagari   (lang: hi)
#   hg-s*/hg-l* = Hinglish, Latin     (lang: hi)
# s = scam, l = legit/genuine.
# Totals: en=25, hi-Devanagari=20, hi-Hinglish=15.

# ============================= SCAMS (36) =============================

