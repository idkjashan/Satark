# tests/golden/heldout_v3.yaml
# Blind held-out generalisation set v3 — written without reading config/lexicons,
# config/claim_rules.yaml, config/entities.yaml, config/signals.yaml, satark/checkers/*,
# satark/harness/extract/*, or any existing tests/golden file.
# 60 cases: 36 scam / 24 legit. id prefix drives the script's language bucket:
# en- = English, hd- = Hindi (Devanagari), hg- = Hinglish (both lang: hi).

# ───────────────────────── ENGLISH — SCAM (en-01..en-14) ─────────────────────────

- id: en-01
  lang: en
  text: "🚀 FINAL CALL: Join 'AlgoWin Trader' bot before 6pm today. Fully SEBI-approvd algorithm, trades Nifty options automatically, avg 4-6% DAILY. Minimum deposit just ₹15,000, withdraw anytime. 2300+ members already earning. Click to activate: bit.ly/algowin-vip (slots filling fast, admin will remove link after 50 more joins)"
  expect:
    verdict: scam
  type: sebi_algo_bot
  note: "Fake SEBI-approval claim + unrealistic guaranteed daily % returns + urgency/scarcity + shortened link."

- id: en-02
  lang: en
  text: "Hi, got your number from a mutual friend. We deal in unlisted pre-IPO shares – currently have a limited lot of a fintech co. expected to list next year at 3x price. Minimum lot 500 shares @ ₹240/share. Payment via UPI to rahul.unlisted@okaxis, shares transferred to your demat in 48 hrs. Let me know if interested, only 2 lots left."
  expect:
    verdict: scam
  type: pre_ipo
  note: "Cold unsolicited pre-IPO pitch, guaranteed listing-gain claim, upfront UPI payment before any transfer."

- id: en-03
  lang: en
  text: "Dear Investor, this is to inform that your profile is upgraded to our US-regulated NRI trading desk (partner of a global broker). You can now trade US stocks + forex with 1:500 leverage. Open account with min $500, our relationship manager Mr. Alan Fernandes will assist on WhatsApp +91 97654 32109. Fully tax free for NRI clients."
  expect:
    verdict: scam
  type: fake_nri_broker
  note: "Claims foreign regulation + unsolicited 'upgrade', high leverage forex, false tax-free claim, WhatsApp-only RM."

- id: en-04
  lang: en
  text: "NEW NFO ALERT 📢 'Secure Growth Fund' opens today only. The AMC has structured this with assured 18% p.a. for the first 3 years, capital protection guaranteed by the fund house. Invest min ₹25,000 before the 5pm cutoff, allotment on first come basis. Reply YES to get the application link."
  expect:
    verdict: scam
  type: nfo_assured
  note: "Mutual funds cannot legally promise fixed/assured returns or capital protection in an NFO; single-day cutoff pressure."

- id: en-05
  lang: en
  text: "Diwali special 🪙 Buy Digital Gold Bonds on GoldPeak app – booking price ₹4,650/gm, we GUARANTEE buyback at ₹9,000/gm in 6 months or your money back double. Limited to first 1000 users. Just need PAN photo + payment via UPI to goldpeak.booking@ybl"
  expect:
    verdict: scam
  type: digital_gold_bond
  note: "No legitimate gold bond doubles price in 6 months with a 'guarantee'; PAN photo + UPI deposit to a personal-looking handle."

- id: en-06
  lang: en
  text: "[Voice note transcript 0:52] Hello, I'm Priya, your account manager from OceanFX Global Markets, assigned after your demo request. Our VIP signal group made +₹3.2 lakh for members last week in forex. To activate your live account, top up minimum $300 margin, I'll personally place trades for you, 90% win rate guaranteed."
  expect:
    verdict: scam
  type: forex_whatsapp
  note: "Unsolicited personal 'account manager', guaranteed win rate, asks to fund an account she will trade on your behalf."

- id: en-07
  lang: en
  text: "🎁 CONGRATULATIONS! Your wallet address is whitelisted for the ApnaCoin airdrop – claim 5000 APN tokens (~₹40,000 value) free. To claim, connect your wallet and enter your 12-word recovery phrase on apnacoin-claim.xyz within 24 hrs or the allocation will be forfeited."
  expect:
    verdict: scam
  type: crypto_airdrop
  note: "Asking for a wallet seed phrase is a direct asset-drain request; fake urgency deadline; unofficial-looking domain."

- id: en-08
  lang: en
  text: "RBI NOTICE: As per the DICGC scheme your bank a/c is eligible for a pending insurance refund of ₹1,00,000 due to a recent bank merger. To process, verify your details and pay a nominal processing fee of ₹499 at rbi-dicgc-refund.in within 48 hours, else the claim will lapse."
  expect:
    verdict: scam
  type: fake_refund_dicgc
  note: "RBI/DICGC never ask for a processing fee to release deposit insurance; fake urgency + fee-upfront request."

- id: en-09
  lang: en
  text: "URGENT: Your mobile number will be deactivated today due to pending e-KYC as per new TRAI/SEBI rule, this will also freeze your trading & bank accounts linked to this SIM. Share the OTP you just received to our executive to re-verify immediatly, call +91 90123 45678."
  expect:
    verdict: scam
  type: sim_swap_ekyc
  note: "Pretext regulation + fear of account freeze used to extract the OTP over a call, a classic SIM-swap enabler — never share OTP."

- id: en-10
  lang: en
  text: "Notice from NSDL: Your demat account DP ID ending 4521 shows a KYC mismatch and will be FROZEN in 24 hours per SEBI circular. Avoid freeze — update now: nsdl-kyc-verify.net/update (link valid for 1 use only)"
  expect:
    verdict: scam
  type: demat_freeze
  note: "Impersonates NSDL, fabricated 24-hr freeze threat, phishing link on a non-official domain."

- id: en-11
  lang: en
  text: "Hey 😊 been really enjoying our late night calls this week. Btw I mentioned my cousin runs a private trading desk in Singapore — he's letting a few of us close friends in on his USDT arbitrage pool, already turned my ₹80,000 into ₹2.1 lakh in 3 weeks. I don't want you to miss it, want me to ask him to open a slot for you too? 🥰"
  expect:
    verdict: scam
  type: pig_butchering
  note: "Romance-building rapport followed by a 'friend/cousin's exclusive' trading pool with implausible short-term returns — classic pig-butchering pattern."

- id: en-12
  lang: en
  text: "My options mentorship batch starts Monday 🔥 last batch members' screenshots attached (avg +₹58,000/week each, see pinned). Join the VIP copy-trade group for ₹4,999 lifetime, I place the trade in my account, you just mirror the same in yours in real time. Only 15 seats left, DM 'VIP' to book."
  expect:
    verdict: scam
  type: copy_trade_influencer
  note: "Influencer-style profit screenshots + paid access to 'copy my trades' + fake scarcity, no verifiable track record."

- id: en-13
  lang: en
  text: "Your QuickCash loan of ₹50,000 is pre-approved instantly! Download the app to receive funds: quickcash-instant.in/QuickCash.apk — but before disbursal you must first activate a mandatory 'investment-linked insurance' of ₹2,500 which doubles as collateral and gets refunded with 12% intrest in 1 year. Pay now to release the loan same day."
  expect:
    verdict: scam
  type: loan_app_combo
  note: "Ties loan disbursal to an upfront 'investment' payment via a sideloaded .apk — a known loan-app-plus-investment extraction pattern."

- id: en-14
  lang: en
  text: "Have you seen this?? 😳 Video of a well known business tycoon on a 'news channel' revealing he personally uses this trading app and guarantees 10x in 3 months. Link to full video + app signup: tiny.cc/tycoon-secret (he says watch before they take it down)"
  expect:
    verdict: scam
  type: deepfake_promo
  note: "Forwarded deepfake-style video using a vague 'famous tycoon' framing to lend fake credibility to a 10x guarantee."

# ───────────────────────── ENGLISH — LEGIT (en-15..en-24) ─────────────────────────

- id: en-15
  lang: en
  text: "Investor Awareness: SEBI and NSE remind you that no SEBI-registered intermediary will ever guarantee fixed or 'assured' returns, ask you to trade through a personal WhatsApp 'account manager', or request your trading password/OTP. Messages promising '100% guaranteed profit' or a 'SEBI-approved algo bot' are commonly used by fraudsters. Verify any intermediary on the SEBI website before investing. If in doubt, don't invest, don't share OTP."
  expect:
    verdict: legit
  type: hard_sebi_nse_awareness
  note: "Genuine regulator awareness post that quotes exact scam phrasing to warn against it — must not be flagged just for containing those phrases."

- id: en-16
  lang: en
  text: "Zenith Broking Ltd – Contract Note: Trade confirmation for client ID ZB10234. Bought 25 shares of INFY @ ₹1,452.30 on NSE, order no. 220145698712, brokerage ₹20 + taxes as applicable. Settlement T+1. This is a system-generated confirmation, no action required. For queries contact your RM during market hours."
  expect:
    verdict: legit
  type: hard_broker_contract_note
  note: "Routine transactional trade-confirmation notice with order/settlement detail and no ask — should read as neutral, not risky."

- id: en-17
  lang: en
  text: "Your Consolidated Account Statement (CAS) for the period Apr-Sep 2026 is now available. Folio 884213 with Bluepeak Mutual Fund shows current NAV of ₹58.42 per unit, total units 1,204.55, value ₹70,401. No action needed; the statement is also emailed to your registered email ID as per SEBI/depository norms."
  expect:
    verdict: legit
  type: hard_amc_cas_notice
  note: "Standard CAS/NAV statement notice from a mutual fund — informational, matches real regulatory disclosure format."

- id: en-18
  lang: en
  text: "Reminder from your Depository Participant: As per SEBI/CDSL guidelines, demat accounts without a registered nominee may be frozen for debits after the regulatory deadline. Please log in to your broker portal and add/update your nominee at your convenience. This is a routine compliance reminder, not urgent action within 24 hours."
  expect:
    verdict: legit
  type: hard_depository_nominee_reminder
  note: "Real nominee reminders do reference a freeze-for-non-compliance rule, but give a routine deadline, not a 24-hour panic window — tests whether the checker over-triggers on 'freeze' + 'CDSL' alone."

- id: en-19
  lang: en
  text: "Reminder: The next RBI Retail Direct auction for Government of India Floating Rate Bonds opens next Monday. These carry sovereign guarantee since they are direct RBI/Government obligations, current coupon ~7.1%, minimum investment ₹10,000. Apply directly via the RBI Retail Direct portal, no broker fee involved."
  expect:
    verdict: legit
  type: hard_rbi_retail_direct_bond
  note: "A real government bond truthfully carries a sovereign guarantee — checker must distinguish this from the fake 'guarantee' claims used by scams."

- id: en-20
  lang: en
  text: "Dear Customer, your Fixed Deposit A/c no. XXXXXX4821 of ₹1,50,000 matures on 14-Oct-2026 at 7.1% p.a. It will auto-renew for the same tenure unless you visit the branch or net banking to change instructions. – Capital Bridge Bank"
  expect:
    verdict: legit
  type: bank_fd_maturity_notice
  note: "Routine bank transactional notice, no urgency, no ask — plain benign message."

- id: en-21
  lang: en
  text: "Sensex closed up 0.6% today, Nifty around 24,850. IT stocks rallied after good US cues, banking was flat. Nothing major happening, just a quiet trading day."
  expect:
    verdict: legit
  type: market_chat_casual
  note: "Ordinary market commentary with real-style percentages, no investment pitch of any kind."

- id: en-22
  lang: en
  text: "Quick q – is it worth switching my Nifty 50 index fund from a regular plan (1.1% expense ratio) to the direct plan (0.2%)? Over 15 years that difference seems huge but I'm not sure how switching affects my existing LTCG."
  expect:
    verdict: legit
  type: index_fund_expense_ratio_question
  note: "A genuine, reasonably informed investor question about expense ratios and tax — should read as clearly benign."

- id: en-23
  lang: en
  text: "Got my annual bonus, thinking of putting half in my existing index fund SIP top-up and keeping the rest in an FD for the house down payment next year. Does that split sound reasonable to you?"
  expect:
    verdict: legit
  type: diversify_after_bonus_chat
  note: "Everyday personal-finance planning chat between friends, no scam signals, tests for false positives on normal money talk."

- id: en-24
  lang: en
  text: "Your e-statement for savings account ending 2290 for September 2026 is ready. View/download it anytime by logging into net banking or the mobile app. No action required if details are correct."
  expect:
    verdict: legit
  type: bank_estatement_reminder
  note: "Purely informational transactional bank message with no ask — baseline benign control."

