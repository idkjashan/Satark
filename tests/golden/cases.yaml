# Golden evaluation set (docs/CONTRACTS.md §8). 30 scams across T1-T11 + 15 legitimate messages.
# All identifiers are FICTIONAL or match tests/fixtures/fixture_db.py test rows. Expectations rely only
# on deterministic, offline signals (fixture registry/caution/app/social/popularity lookups, the @valid
# UPI format rule, the text red-flag lexicon, return-rate maths, APK links, look-alike domains, brand
# impersonation via config/brands.yaml, and "registered as" claims near a sebi.reg_no) per
# config/signals.yaml weights and config/scoring.yaml: any critical -> HIGH_RISK; 2 different high
# codes -> HIGH_RISK; 1 high or 2 medium -> SUSPICIOUS; otherwise NO_SIGNS.

