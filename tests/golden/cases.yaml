    level: HIGH_RISK
    codes_any: [VIP_GROUP, GUARANTEED_RETURN, IMPOSSIBLE_RETURN, SIDELOAD_APK, URGENCY, UNSOLICITED_CONTACT]
    codes_none: [REG_FOUND, DOMAIN_OFFICIAL]
  note: "T1 fake trading-app trap. VIP group + guaranteed daily return + direct .apk link + urgency: 3+ high-weight codes, so HIGH_RISK."

