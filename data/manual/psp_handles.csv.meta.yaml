licence: "Hand-curated. @ybl/@ibl/@axl, @okaxis/@okhdfcbank/@okicici/@oksbi, @paytm/@ptyes/@ptaxis/@pthdfc/@ptsbi, @apl/@yapl/@rapl, @waicici/@waaxis/@wahdfcbank/@wasbi and @upi are the handle groups documented in the LLD (§8.3) from NPCI's third-party-app page. @validhdfc and @validicici are the two worked examples given in the SEBI circular's body text (sections 2.1 and the FAQ in Annexure F) for the @valid handle issued to SEBI-registered intermediaries; the circular's Annexure C lists all 52 banks eligible to issue a '@valid<bank>' handle but only hdfc and icici appear as literal handle strings in the circular text, so only those two are included here (never invent the others). For apl/yapl/rapl the circular and LLD name only the app (Amazon Pay), not a per-handle bank, so `bank` is left as 'Amazon Pay' rather than guessing a specific bank."
