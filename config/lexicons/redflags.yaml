# Red-flag phrase lexicon for text.redflags (LLD §9.8; HLD Appendix C.2 seed phrases + SEBI PR
# phrases). Loaded by satark/config.py into ctx.config.lexicons["redflags"].
#
# Shape: {CODE: {en: [regex...], hi: [regex...], hinglish: [regex...]}}. Matching is
# case-insensitive (satark/checkers/text.py). Patterns are precise on purpose (word-ish
# boundaries, short proximity windows) so a genuine broker/bank message does not fire them;
# satark/checkers/text.py also discards a match whose short preceding window contains a
# negator ("never", "don't", Hindi न/मत/नहीं as a whole token), so "never share your OTP"
# does not read as a request for one.
#
# CELEBRITY_ENDORSEMENT is not here: it is a proximity rule (a brands.yaml kind=celebrity
# alias near an investment word), computed in satark/checkers/text.py from brands.yaml.
# CRYPTO_PAYMENT_REQUEST, REG_CLAIM_NO_NUMBER and SENSITIVE_DATA_SHARED are claims.rules
# codes (claim-type driven, not phrase-driven) and are not here either.





