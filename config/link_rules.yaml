# free_hosting: a landing page on infrastructure anyone can spin up for free, not a company's own
# site. A bare host matches any path; "*.suffix" matches that suffix and any subdomain of it;
# "host/prefix" matches only that path prefix on that host (see link.google_hosted).
free_hosting:
  - forms.gle
  - docs.google.com/forms
  - sites.google.com
  - drive.google.com
  - "*.web.app"
  - "*.firebaseapp.com"
  - "*.netlify.app"
  - "*.vercel.app"
  - "*.github.io"
  - "*.blogspot.com"
  - "*.wixsite.com"
  - "*.weebly.com"
  - "*.000webhostapp.com"

# known_spoofs: domains seen imitating a government claims process (IEPF unclaimed-shares refunds,
# Sahara-refund schemes) that are not the real agency's own domain. Seed; extend from caution notices.
known_spoofs:
  - iepf.org.in
  - iepfclaim.com
  - iepf-india.com
  - sahara-refund.in
  - sahararefund.com
  - saharirefund.com
