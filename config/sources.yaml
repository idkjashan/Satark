  as_on: "from .meta.yaml"
  gates: {key_pattern: '^.{2,}$', min_rows: 10000, max_drop_pct: 5}
  max_age_days: 30
  licence: "NSE terms (as above)"

nse_equity_list:
  name: "NSE listed equity securities (EQUITY_L)"
  group: "Exchange lists"
  kind: nse_csv
  path: data/manual/nse/EQUITY_L.csv
  table: listed_security
  as_on: "from .meta.yaml"
  gates: {key_pattern: '^[A-Z0-9&-]+$', min_rows: 1500, max_drop_pct: 5}
  max_age_days: 30
  licence: "NSE terms (as above)"

crux_india:
  name: "Chrome UX Report India top list"
  group: "Reference data"
  kind: crux_gz
  path: data/manual/crux/in_202608.csv.gz
  table: popularity
  as_on: "from .meta.yaml (the CrUX data month, not the download date)"
  gates: {key_pattern: '^[a-z0-9.-]+\.[a-z]{2,}$', min_rows: 200000, max_drop_pct: 10}
  max_age_days: 60
  licence: "CrUX data CC BY 4.0"

psp_handles:
  name: "UPI handle to bank/app map"
  group: "Reference data"
  kind: curated_csv
  path: data/manual/psp_handles.csv
  table: psp_handle
  as_on: "from .meta.yaml"
  gates: {key_pattern: '^[a-z0-9]+$', min_rows: 10, max_drop_pct: 10}
  max_age_days: 180
  licence: "Hand-curated from the SEBI @valid circular and publicly documented PSP handle prefixes"

# ---- Live services (no table; the executor reads only `rate` and `max_age_days`) --------------

rdap:
  name: "RDAP domain registration lookup"
  verify_url: "https://lookup.icann.org/en/lookup?name={value}"   # where the user can check it themselves; {value} is the identifier
  group: "Live services"
  kind: live
  rate: "5/1s"
  max_age_days: 7

play:
  name: "Google Play store listing"
  verify_url: "https://play.google.com/store/apps/details?id={value}"   # where the user can check it themselves; {value} is the identifier
  group: "Live services"
  kind: live
  rate: "1/1s"
  max_age_days: 1

safe_browsing:
  name: "Google Safe Browsing (optional, needs SATARK_SAFE_BROWSING_KEY)"
  verify_url: "https://transparencyreport.google.com/safe-browsing/search?url={value}"   # where the user can check it themselves; {value} is the identifier
  group: "Live services"
  kind: live
  rate: "5/1s"
  max_age_days: 1

unshorten:
  name: "Link unshortener"
  group: "Live services"
  kind: live
  rate: "5/1s"
  max_age_days: 1
