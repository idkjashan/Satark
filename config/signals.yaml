# Signals (LLD §9.9). Codes are a contract: checkers declare them in `produces`, the scorer reads
# polarity/weight, the PWA and the template explainer show `signal.<CODE>` from content/i18n/*.json.
#
# polarity: risk (raises the level) | assurance ("what we checked"; never lowers a level) |
#           info (shown, never scored) | flag (asks the harness to reason more; never scored, never shown)
# weight:   critical | high | medium | low   (risk only; seeds to tune on the golden set)
# skill:    skills/<name>/SKILL.md loaded by the explainer when this code is a top reason
# simulator: S1 fake trading app · S2 guaranteed-return maths · S3 leverage wipe-out
# actions:  ids from content/portals.json -> actions
# scam_types: T1..T11 (docs/reference/hld.txt, Appendix C)
# suppressed_by: drop this risk code when any listed code is present in the case

