# LLM roles (LLD §6.6). Model ids come from the environment (see satark/harness/models.py):
#   SATARK_LLM="anthropic:claude-haiku-4-5"          all roles
#   SATARK_LLM_RESPOND="anthropic:claude-sonnet-5"    one role (comma list = fallback chain)
#   SATARK_LLM="vertex-claude:claude-haiku-4-5"       Claude on Vertex AI (GOOGLE_CLOUD_PROJECT, CLAUDE_REGION)
#   SATARK_LLM="google-gla:gemini-2.5-flash"          Gemini API (GEMINI_API_KEY)
# Nothing set = deterministic mode: regex extraction, template explanations, FAQ chat answers.
# temperature 0 for judgement roles: the same message gets the same review (and evals are repeatable).
roles:
  extract: {timeout_s: 6, max_tokens: 1500, temperature: 0}
  assess:  {timeout_s: 40, max_tokens: 1500, temperature: 0, context_tokens: 3200, step_timeout_s: 20}  # agent loop steps + judge
  explain: {timeout_s: 4, max_tokens: 600, temperature: 0}
  respond: {timeout_s: 30, max_tokens: 800, temperature: 0.2, context_tokens: 3200, step_timeout_s: 20}  # sized for qwen3:4b (chat answers with knowledge chunks)
  image:   {timeout_s: 45, max_tokens: 900, temperature: 0}   # screenshot reading; only SATARK_LLM_IMAGE, never inherited
prices_usd_per_mtok:
  claude-sonnet-5: [2, 10]
  claude-haiku-4-5: [1, 5]
daily_cost_cap_usd: 20
# Circuit breaker: after this many failed model calls in a row a role is skipped for breaker_pause_s seconds, so
# during an outage users get the rule verdict at once instead of waiting for every timeout.
breaker_failures: 3
breaker_pause_s: 60
